<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DALE!!</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        :root {
            --bg: #000000;
            --card: #121212;
            --card-hover: #1a1a1a;
            --border: #262626;
            --text: #f0f0f0;
            --muted: #666666;
            --strike: #404040;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 30px 16px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* HEADER DALE!! */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--white);
            padding-bottom: 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .brand h1 {
            font-size: 2rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .today-date {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            text-align: right;
            font-weight: 600;
        }

        /* SECCIONES */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .badge {
            font-size: 0.75rem;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--muted);
        }

        /* INPUTS */
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        input[type="text"], input[type="date"] {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"]:focus, input[type="date"]:focus {
            border-color: var(--white);
        }

        input[type="text"] { flex: 1; }
        input[type="date"] { color-scheme: dark; }

        button.btn-add {
            background: var(--white);
            color: var(--bg);
            border: none;
            border-radius: 4px;
            padding: 0 16px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
        }

        button.btn-add:hover { opacity: 0.85; }

        /* LISTAS */
        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        li {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            user-select: none;
            transition: background 0.15s;
        }

        li:hover { background: var(--card-hover); }

        .task-content {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            cursor: pointer;
        }

        .task-text { transition: color 0.2s; }

        li.done .task-text {
            text-decoration: line-through;
            color: var(--strike);
        }

        .custom-bullet {
            width: 8px;
            height: 8px;
            background: var(--muted);
            border-radius: 50%;
        }

        li.done .custom-bullet {
            background: var(--strike);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-link:hover { color: var(--white); }

        /* EVENTOS CALENDARIO */
        .event-tag {
            font-size: 0.7rem;
            background: #222;
            border: 1px solid #333;
            padding: 2px 6px;
            border-radius: 3px;
            color: #aaa;
            margin-right: 8px;
            font-family: monospace;
        }

        .event-today .event-tag {
            background: var(--white);
            color: var(--bg);
            font-weight: bold;
        }

        .btn-clean {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 6px;
            text-decoration: underline;
        }
        .btn-clean:hover { color: var(--white); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <img src="icon.png" alt="Dale!!" onerror="this.style.display='none'">
            <h1>DALE!!</h1>
        </div>
        <div class="today-date" id="date-label"></div>
    </header>

    <!-- 1. PRIORIDADES DE HOY -->
    <section>
        <div class="section-header">
            <span class="section-title">Hoy (Máximo 5)</span>
            <span class="badge" id="today-counter">0 / 5</span>
        </div>
        <form class="input-group" id="today-form">
            <input type="text" id="today-input" placeholder="Tarea clave para hoy..." autocomplete="off">
            <button type="submit" class="btn-add">+</button>
        </form>
        <ul id="today-list"></ul>
        <button class="btn-clean" id="clear-done-btn">Limpiar tareas tachadas</button>
    </section>

    <!-- 2. FECHAS CLAVE (CALENDARIO) -->
    <section>
        <div class="section-header">
            <span class="section-title">Fechas Clave / Agenda</span>
        </div>
        <form class="input-group" id="event-form">
            <input type="text" id="event-text" placeholder="Vencimiento, reunión, fecha..." required autocomplete="off">
            <input type="date" id="event-date" required>
            <button type="submit" class="btn-add">+</button>
        </form>
        <ul id="event-list"></ul>
    </section>

    <!-- 3. CAJÓN DE PENDIENTES -->
    <section>
        <div class="section-header">
            <span class="section-title">Cajón de Pendientes</span>
        </div>
        <form class="input-group" id="backlog-form">
            <input type="text" id="backlog-input" placeholder="Anotar para no olvidar..." autocomplete="off">
            <button type="submit" class="btn-add">+</button>
        </form>
        <ul id="backlog-list"></ul>
    </section>
</div>

<script>
    // Fecha actual
    const now = new Date();
    const todayStr = now.toISOString().split('T')[0];
    document.getElementById('date-label').textContent = now.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });

    // Cargar datos
    let todayTasks = JSON.parse(localStorage.getItem('dale_today')) || [];
    let keyEvents = JSON.parse(localStorage.getItem('dale_events')) || [];
    let backlog = JSON.parse(localStorage.getItem('dale_backlog')) || [];

    function save() {
        localStorage.setItem('dale_today', JSON.stringify(todayTasks));
        localStorage.setItem('dale_events', JSON.stringify(keyEvents));
        localStorage.setItem('dale_backlog', JSON.stringify(backlog));
        render();
    }

    function render() {
        // 1. Render Hoy
        const todayList = document.getElementById('today-list');
        todayList.innerHTML = '';
        document.getElementById('today-counter').textContent = `${todayTasks.length} / 5`;

        todayTasks.forEach((t, i) => {
            const li = document.createElement('li');
            if (t.done) li.classList.add('done');
            li.innerHTML = `
                <div class="task-content">
                    <span class="custom-bullet"></span>
                    <span class="task-text">${t.text}</span>
                </div>
                <button class="btn-link" onclick="deleteToday(${i})">✕</button>
            `;
            li.querySelector('.task-content').onclick = () => {
                t.done = !t.done;
                save();
            };
            todayList.appendChild(li);
        });

        // 2. Render Fechas Clave (ordenadas por fecha)
        const eventList = document.getElementById('event-list');
        eventList.innerHTML = '';
        keyEvents.sort((a, b) => new Date(a.date) - new Date(b.date));

        keyEvents.forEach((ev, i) => {
            const li = document.createElement('li');
            if (ev.date === todayStr) li.classList.add('event-today');

            li.innerHTML = `
                <div>
                    <span class="event-tag">${ev.date}</span>
                    <span>${ev.text}</span>
                </div>
                <button class="btn-link" onclick="deleteEvent(${i})">✕</button>
            `;
            eventList.appendChild(li);
        });

        // 3. Render Cajón
        const backlogList = document.getElementById('backlog-list');
        backlogList.innerHTML = '';
        backlog.forEach((b, i) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${b.text}</span>
                <div class="actions">
                    <button class="btn-link" onclick="moveToToday(${i})">↑ Pasar a Hoy</button>
                    <button class="btn-link" onclick="deleteBacklog(${i})">✕</button>
                </div>
            `;
            backlogList.appendChild(li);
        });
    }

    // Handlers
    document.getElementById('today-form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('today-input');
        if (todayTasks.length >= 5) {
            alert('¡Llegaste a las 5 prioridades! Cerrá o eliminá una para sumar otra.');
            return;
        }
        if (input.value.trim()) {
            todayTasks.push({ text: input.value.trim(), done: false });
            input.value = '';
            save();
        }
    };

    document.getElementById('event-form').onsubmit = (e) => {
        e.preventDefault();
        const text = document.getElementById('event-text').value.trim();
        const date = document.getElementById('event-date').value;
        if (text && date) {
            keyEvents.push({ text, date });
            document.getElementById('event-text').value = '';
            save();
        }
    };

    document.getElementById('backlog-form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('backlog-input');
        if (input.value.trim()) {
            backlog.push({ text: input.value.trim() });
            input.value = '';
            save();
        }
    };

    window.deleteToday = (i) => { todayTasks.splice(i, 1); save(); };
    window.deleteEvent = (i) => { keyEvents.splice(i, 1); save(); };
    window.deleteBacklog = (i) => { backlog.splice(i, 1); save(); };

    window.moveToToday = (i) => {
        if (todayTasks.length >= 5) {
            alert('La lista de Hoy ya está llena (5/5).');
            return;
        }
        const item = backlog.splice(i, 1)[0];
        todayTasks.push({ text: item.text, done: false });
        save();
    };

    document.getElementById('clear-done-btn').onclick = () => {
        todayTasks = todayTasks.filter(t => !t.done);
        save();
    };

    // Pedir permiso y alertar eventos del día
    if ("Notification" in window) {
        if (Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }
        // Avisar si hay algo para hoy
        const todayEvents = keyEvents.filter(ev => ev.date === todayStr);
        if (todayEvents.length > 0 && Notification.permission === "granted") {
            new Notification("DALE!! - Tenés fechas clave hoy:", {
                body: todayEvents.map(e => "• " + e.text).join("\n"),
                icon: "icon.png"
            });
        }
    }

    render();
</script>
</body>
</html>
